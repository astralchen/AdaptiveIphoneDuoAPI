# 此工作流用于构建 Swift 项目。
# 更多信息请参阅：https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: 构建
      run: swift build -v
    - name: 运行测试
      run: swift test -v
